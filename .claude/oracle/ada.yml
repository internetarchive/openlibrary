# Oracle checklist — ADA role (one ada, one PR).
#
# This file is PURE DATA: the Oracle engine (the standalone `oracle` tool) walks
# these states in order and runs each `check:` as `bash -c`. The FIRST state whose
# check fails becomes the next prompt (force-continue, exit 2). When every state
# passes, the stop is allowed (exit 0). No executable oracle code lives in this
# repo — only this spec. The Stop-hook entry point, role routing (ada vs lead via
# `agents whoami`), and fail-open-on-error are the ENGINE's job, not OL's.
#
# Terminal = (all work items met) OR (a valid blocked-escape).
#
# State is artifact-native: every predicate re-derives live from the PR on GitHub.
# The one structured carrier is an HTML-comment block in the PR body (invisible in
# rendered Markdown). The LAST such block in the body is authoritative (so an
# illustrative example earlier in the description never shadows the real stamp):
#
#   <!-- oracle
#   status: developing
#   head: <the HEAD sha the plan was last written against>
#   blocker: <type>: <specifics>        # only when status: blocked
#   -->
#
# status vocab: investigating | developing | blocked | ready-for-review |
#               needs-decision | merged-pending-deploy
# blocker type: decision-needed | missing-info | access | upstream-dependency
#
# `gh pr view` with no argument resolves the PR for the current branch. Checks that
# cannot reach GitHub will gate rather than fail open; the engine's error verdict
# and attempt cap are the backstops (clean per-check fail-open wants an engine
# builtin — see the PR description). The awk below extracts the LAST oracle block.

context: []

states:
  # Blocked-escape: when the plan's status is `blocked`, require a typed, lead-
  # actionable blocker. A valid one lets the remaining items fall through to a
  # clean stop; an invalid "haven't-finished-looking" bail is force-continued.
  # (The lazy-phrase rejection is reduced to typed + 15-char-specifics here, which
  # is all inline shell can express cleanly; richer rejection wants an engine
  # builtin — flagged in the PR.)
  - id: blocked-reject
    applies_when: |-
      gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iqE '^[[:space:]]*status:[[:space:]]*blocked\b'
    check: |-
      gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iqE '^[[:space:]]*blocker:[[:space:]]*(decision-needed|missing-info|access|upstream-dependency):[[:space:]]*.{15,}$'
    prompt: |
      Your plan's status is `blocked`, but the blocker is not a valid escape. A
      blocker clears you to stop ONLY if a LEAD can act on it by conversing with
      you. In the oracle block of the PR body, write:

          blocker: <type>: <specific, lead-actionable detail>

      where <type> is one of: decision-needed | missing-info | access |
      upstream-dependency, with real specifics (not "still investigating" / "need
      to look more" — that is unfinished work, so keep going). If you are not
      actually blocked, change `status:` and continue.

  # 1. Working tree clean. Skipped when blocked (never force a commit — a broken-
  #    env block may have nothing worth committing).
  - id: tree-clean
    applies_when: |-
      ! gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iqE '^[[:space:]]*status:[[:space:]]*blocked\b'
    check: test -z "$(git status --porcelain)"
    prompt: |
      Your working tree has uncommitted changes. Commit them with a clear message
      (`git add -A && git commit`), then continue. If some changes are scratch,
      remove or stash them first — but do not leave the tree dirty.

  # 2. Commits ahead are pushed. Applies even when blocked, so the lead inherits
  #    your partial state (it only pushes what is already committed; never commits).
  - id: pushed
    check: >-
      U=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null);
      test -n "$U" && test -z "$(git log '@{u}'..HEAD --oneline 2>/dev/null)"
    prompt: |
      You have local commits that are not on the remote. Push them so the work is
      visible (and the lead can see it):

          git push -u origin HEAD

  # 3. A PR exists for this branch (open a DRAFT; its body is the plan).
  - id: pr-exists
    check: gh pr view --json number -q .number >/dev/null 2>&1
    prompt: |
      No open PR for this branch. Open a DRAFT PR whose body IS your plan:

          gh pr create --draft --title "<concise title>" --body "<plan>"

      Include the oracle block so the checklist can read your status and head SHA:

          <!-- oracle
          status: developing
          head: <paste `git rev-parse HEAD`>
          -->

  # 4. PR body is non-empty (the plan is actually written).
  - id: pr-body
    check: test -n "$(gh pr view --json body -q .body 2>/dev/null | tr -d '[:space:]')"
    prompt: |
      The PR body is empty. Write the plan: what you are building, the approach,
      current status, and the oracle block (status + head SHA).

  # 5. Plan current with work — SHA equality. The LAST oracle block's recorded
  #    `head:` must match the PR's live headRefOid (prefix match tolerates a short
  #    SHA). Skipped when blocked (the plan then carries the blocker, not a code
  #    summary).
  - id: plan-current
    applies_when: |-
      ! gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iqE '^[[:space:]]*status:[[:space:]]*blocked\b'
    check: |-
      H=$(gh pr view --json headRefOid -q .headRefOid 2>/dev/null)
      S=$(gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iE '^[[:space:]]*head:' | tail -1 | sed -E 's/^[[:space:]]*head:[[:space:]]*//I; s/[[:space:]]*$//')
      test -n "$H" && test -n "$S" && { [ "${H#$S}" != "$H" ] || [ "${S#$H}" != "$S" ]; }
    prompt: |
      Your plan is stale: the oracle block's `head:` SHA does not match the PR's
      current pushed HEAD — you pushed code without refreshing the plan. Update the
      PR description to reflect the latest commits, and stamp the current HEAD:

          head: <paste `git rev-parse HEAD`>

  # 6. Status set — one of the vocabulary values in the LAST oracle block.
  - id: status-set
    check: |-
      gh pr view --json body -q .body 2>/dev/null | awk '/<!--[[:space:]]*oracle/{inb=1;cur=""} inb{cur=cur $0 "\n"} /-->/&&inb{inb=0;last=cur} END{printf "%s",last}' | grep -iqE '^[[:space:]]*status:[[:space:]]*(investigating|developing|blocked|ready-for-review|needs-decision|merged-pending-deploy)[[:space:]]*$'
    prompt: |
      Set a status in the oracle block of the PR body. One of:
      investigating | developing | ready-for-review | needs-decision |
      merged-pending-deploy | blocked.
