services:
  db:
    profiles:
      - build
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
    working_dir: "/solr_builder"
    volumes:
      # Big-storage bind (1TB volume): the imported dump table dwarfs the OS
      # disk. postgres:18 stores data under /var/lib/postgresql/<major>/.
      - "/mnt/HC_Volume_106672133/openlibrary/postgres:/var/lib/postgresql"
      - ".:/solr_builder"
      - "/storage:/storage"
    networks:
      - db-access

  adminer:
    profiles:
      - build
    image: adminer
    restart: unless-stopped
    ports:
      - 8087:8080
    networks:
      - db-access

  solr:
    profiles:
      - build
    image: solr:10.0.0
    restart: on-failure
    environment:
      # This is optimized for bulk loading, so a lot of the auto*Commits are disabled
      # Keep other SOLR_OPTS in sync with other instances of solr in compose files
      - SOLR_OPTS=
        -Dsolr.autoSoftCommit.maxTime=-1
        -Dsolr.autoCommit.maxTime=3600000
        -Dsolr.environment=test
      - SOLR_MODULES=analysis-extras
      - SOLR_JAVA_MEM=-Xms3g -Xmx3g
    ports:
      - 8983:8983
    volumes:
      # Big-storage bind (1TB volume): the solr index grows to tens of GB and
      # the optimize step transiently needs ~2x that.
      - "/mnt/HC_Volume_106672133/openlibrary/solr:/var/solr"
      - ../../conf/solr:/opt/solr/server/solr/configsets/olconfig:ro
    networks:
      - solr-access
    command: solr-precreate openlibrary /opt/solr/server/solr/configsets/olconfig

  # Only run these two services if we're connecting this solr to production/testing
  # To run:
  # docker compose down
  # docker compose --profile production up -d
  solr_prod:
    profiles:
      - production
    restart: unless-stopped
    image: solr:10.0.0
    expose:
      - 8983
    ports:
      - 8983:8983
    environment:
      # Keep in sync with compose.production.yaml
      - SOLR_OPTS=
        -Dsolr.autoSoftCommit.maxTime=60000
        -Dsolr.autoCommit.maxTime=120000
        -Dsolr.max.booleanClauses=30000
        -Dsolr.environment=stage
        -Dol.replication.role.leader=true
      - SOLR_MODULES=analysis-extras
      # More memory for production
      - SOLR_JAVA_MEM=-Xms10g -Xmx10g
      # This might overwrite the above?
      - SOLR_HEAP=8g
    volumes:
      - solr-data:/var/solr
      - ../../conf/solr:/opt/solr/server/solr/configsets/olconfig:ro
    networks:
      solr-access:
        aliases:
          - solr  # Override other solr service's hostname
    logging:
      options:
        max-size: "512m"
        max-file: "4"
    # Create (or use if already existing) a core called "openlibrary" with our config & schema
    command: solr-precreate openlibrary /opt/solr/server/solr/configsets/olconfig

  # We need ability to use openlibrary code
  ol:
    profiles:
      - never
    image: olpython:latest
    build:
      context: ../..
      dockerfile: scripts/solr_builder/Dockerfile.olpython
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    volumes:
      # Persistent volume mount for installed git submodules
      - ol-vendor:/openlibrary/vendor
      # The above volume mounts are required so that the local dev bind mount below
      # does not clobber the data generated inside the image / container
      - "../../:/openlibrary"
      - "/storage:/storage"
    environment:
      # Tunables forwarded to index-type.sh / solr_builder.py; set them on the
      # `docker compose run` invocation, e.g.
      #   SKIP_IA_METADATA=1 CHUNK_ETA=70 docker compose run --rm ol ./index-type.sh work 18 works
      - CHUNK_ETA=${CHUNK_ETA:-}
      - SKIP_IA_METADATA=${SKIP_IA_METADATA:-}
    networks:
      - solr-access
      - db-access

  # Pinned, code-defined Jenkins controller that runs this pipeline.
  # All config lives in ./jenkins/ (Dockerfile, plugins.txt, JCasC, seed job).
  # Start with: ADMIN_PASSWORD=... docker compose --profile jenkins up -d jenkins
  jenkins:
    profiles:
      - jenkins
    build:
      context: ./jenkins
    image: openlibrary/solr-builder-jenkins:2.568.2
    restart: unless-stopped
    # Legacy deployments ran the controller as root; docker-workflow starts
    # build containers with the same uid, and the pipeline's docker CLI needs a
    # writable HOME/config dir (otherwise `mkdir /.docker: permission denied`).
    user: root
    ports:
      # JENKINS_HTTP_PORT override lets the controller coexist with a dev stack
      # already bound to 8080 (e.g. docker compose up openlibrary on this host).
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      # Required at first boot; JCasC seeds the admin user's password from it.
      # Intentionally NOT `${ADMIN_PASSWORD:?...}`: required-var syntax makes
      # EVERY `docker compose` command in this project fail (including the
      # pipeline's own, which runs without this var set) whenever the whole
      # file gets interpolated. The seed job logs a loud warning instead.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080}
      # Which branch of internetarchive/openlibrary the solr-builder job tracks.
      # Defaults to master. E.g.: SEED_BRANCH=chore/pinned-jenkins-solr-builder
      SEED_BRANCH: ${SEED_BRANCH:-}
      SEED_REPO: ${SEED_REPO:-}
    volumes:
      - "jenkins-data:/var/jenkins_home"
      # Host-path bind (NOT a second named-volume mount): the Jenkinsfile maps
      # its workspace onto /var/lib/docker/volumes/jenkins-data/_data/... so
      # that `docker run/compose` commands see the same files as the controller.
      - "/var/lib/docker/volumes/jenkins-data:/var/lib/docker/volumes/jenkins-data"
      - "/storage:/storage"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  # postgres-data and solr-data moved to big-storage binds (see db/solr
  # services); solr_prod still uses the named solr-data volume.
  solr-data:
  ol-vendor:
  # The exact name matters: the Jenkinsfile runs
  # `docker volume inspect --format=... jenkins-data` on the host.
  jenkins-data:
    name: jenkins-data

networks:
  db-access:
  solr-access:
