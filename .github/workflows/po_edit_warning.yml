name: po_edit_warning

# Warns on PRs that edit openlibrary/i18n/<lang>/messages.po for a language that
# internetarchive/openlibrary-i18n also has: after #13070 those edits are
# overwritten at image build. See scripts/gh_scripts/po_edit_warning.py.
#
# pull_request_target, not pull_request: translation PRs mostly come from forks,
# and a fork's `pull_request` token cannot comment. The checkout below has no
# `ref:`, so it is the base commit; no code from the PR is run.
#
# No `paths:` filter, on purpose: a later push that removes the edits must still
# run, so the comment can be marked resolved. Drafts are included, because a
# run skipped for a draft is not repeated when it is marked ready.
on:  # zizmor: ignore[dangerous-triggers] -- safe: checkout has NO `ref:`, so only base-branch code runs; the PR contributes only API metadata
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: po-edit-warning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    if: github.repository == 'internetarchive/openlibrary'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/gh_scripts/po_edit_warning.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
