name: Auto-assign Code Review

# pull_request_target, not pull_request: a `pull_request` run triggered from a fork
# gets a read-only GITHUB_TOKEN, so requestReviewers() below 403s with "Resource not
# accessible by integration" on every externally-contributed PR. pull_request_target
# runs in the base-repo context and keeps the write token.
#
# The usual pull_request_target caveat (it can expose secrets to untrusted fork code)
# does not apply here: this job checks out no code at all -- it only calls the GitHub
# API via actions/github-script, using payload metadata. Nothing from the fork is executed.
on:  # zizmor: ignore[dangerous-triggers] -- safe: no checkout, no fork code executed; only GitHub API calls via actions/github-script using payload metadata
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-assign-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    # Requests the TEAM `openlibrary-agentic-code-reviewer` (member: openlibrary-bot), NOT the bot as
    # an individual. That is the single trigger for code_review_action.yml, which runs the model on a
    # `review_requested` whose requested_team.slug is this team. Requesting a team is NOT blocked by
    # the author-exclusion GitHub applies to requesting a PR's own author (proven on #14450), so this
    # covers our own openlibrary-bot-authored PRs too -- no bot-author exclusion needed here.
    #
    # EVERY non-draft PR, forks included (#14482). The former same-repo clause
    # (head.repo.full_name == github.repository) was a "spend gate" that excluded forks, so an
    # external contribution got no auto-review until a maintainer requested the team by hand.
    # Maintainer decision (2026-11-14): accept the spend and cover forks -- external coverage
    # matters more. Accepted trade: every non-draft fork PR (incl. drive-by/spam from brand-new
    # accounts) now spends the bot's Claude budget, with NO first-time-contributor throttle. This
    # runs on pull_request_target, which GitHub documents as always running in base-repo context
    # regardless of the fork-PR "Approve and run" approval gate -- that gate applies to a
    # pull_request run from a fork, not to pull_request_target. So nothing holds a brand-new
    # account's first run here. This worsens the fail-closed subscription-exhaustion exposure
    # tracked on #14461; a real spend cap is follow-up there. Drafts are still skipped.
    if: >
      !github.event.pull_request.draft
    steps:
      - name: Request the code-reviewer team if not already requested
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # Fine-grained PAT (openlibrary-bot) -- the same org-aware identity the review-post step in
          # code_review_action.yml uses. Requesting a TEAM reviewer needs an identity that can resolve
          # the org team; the default GITHUB_TOKEN is repo-scoped and cannot reliably do so, which would
          # make requestReviewers a silent no-op and leave the auto-review path dead. This job runs on
          # every non-draft PR including forks (#14482), checks out no code, and executes nothing from
          # the PR -- it only calls the GitHub API with payload metadata -- so holding the PAT under
          # pull_request_target is safe for forks too: widening to forks adds no code-execution surface.
          # Same posture as the post/status jobs. The GET-verify below still catches the no-op if the
          # team is not resolvable.
          github-token: ${{ secrets.OL_BOT_REVIEW_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            // Keep this slug in sync with the requested_team.slug guard in code_review_action.yml
            // (a unit test pins them equal). The team must be a repo collaborator with >=read access,
            // and OL_BOT_REVIEW_PAT must be able to resolve it -- the GET-verify below catches failure.
            const TEAM = 'openlibrary-agentic-code-reviewer';

            // Extracted as a named fn (closing over nothing) so a unit test can drive it with a mock
            // github/core and prove both the happy path and the fail-loud silent-no-op path. See
            // tests/unit/js/code_review_trigger.test.js.
            const requestReviewTeam = async ({ github, core, owner, repo, prNumber, team }) => {
              const { data: requested } = await github.rest.pulls.listRequestedReviewers({
                owner, repo, pull_number: prNumber,
              });
              if ((requested.teams || []).some((t) => t.slug === team)) {
                core.info(`PR #${prNumber} already has the ${team} team requested -- skipping.`);
                return;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100,
              });
              if (reviews.some((r) => r.user && r.user.login === 'openlibrary-bot')) {
                core.info(`PR #${prNumber} already has an openlibrary-bot review -- skipping.`);
                return;
              }

              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number: prNumber,
                team_reviewers: [team],
              });

              // Verify the request actually took. requestReviewers can return 200/201 yet leave
              // requested_reviewers EMPTY -- neither 422 nor 404 (documented in this repo at
              // pr_autoresponder.md:72). That silent no-op is the EXPECTED failure if the identity
              // cannot resolve the org team, so a success log here would hide a dead same-repo
              // auto-review path. Re-GET and assert the team is present; fail loudly if it is not.
              const { data: after } = await github.rest.pulls.listRequestedReviewers({
                owner, repo, pull_number: prNumber,
              });
              if (!(after.teams || []).some((t) => t.slug === team)) {
                core.setFailed(
                  `Requested the ${team} team on PR #${prNumber} but it is absent on a follow-up read -- ` +
                  `the request silently no-opped. Confirm the ${team} team is a repo collaborator (>=read) ` +
                  `and that OL_BOT_REVIEW_PAT can resolve the org team (Members: read).`
                );
                return;
              }
              core.info(`Requested the ${team} team as reviewer on PR #${prNumber}.`);
            };

            await requestReviewTeam({ github, core, owner, repo, prNumber, team: TEAM });
