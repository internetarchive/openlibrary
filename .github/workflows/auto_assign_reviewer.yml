name: Auto-assign Code Review

# pull_request_target, not pull_request: a `pull_request` run triggered from a fork
# gets a read-only GITHUB_TOKEN, so requestReviewers() below 403s with "Resource not
# accessible by integration" on every externally-contributed PR. pull_request_target
# runs in the base-repo context and keeps the write token.
#
# The usual pull_request_target caveat (it can expose secrets to untrusted fork code)
# does not apply here: this job checks out no code at all -- it only calls the GitHub
# API via actions/github-script, using payload metadata. Nothing from the fork is executed.
on:  # zizmor: ignore[dangerous-triggers] -- safe: no checkout, no fork code executed; only GitHub API calls via actions/github-script using payload metadata
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-assign-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    # Requests the TEAM `openlibrary-agentic-code-reviewer` (member: openlibrary-bot), NOT the bot as
    # an individual. That is the single trigger for code_review_action.yml, which runs the model on a
    # `review_requested` whose requested_team.slug is this team. Requesting a team is NOT blocked by
    # the author-exclusion GitHub applies to requesting a PR's own author (proven on #14450), so this
    # covers our own openlibrary-bot-authored PRs too -- no bot-author exclusion needed here.
    #
    # SAME-REPO only: a fork gets no auto-request (the spend gate). A fork earns the code-review
    # status only after a maintainer requests the team by hand. Drafts are skipped.
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Request the code-reviewer team if not already requested
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            // Keep this slug in sync with the requested_team.slug guard in code_review_action.yml
            // (a unit test pins them equal). The team must be a repo collaborator with >=read access,
            // or the default GITHUB_TOKEN cannot resolve/request it -- the GET-verify below catches that.
            const TEAM = 'openlibrary-agentic-code-reviewer';

            const { data: requested } = await github.rest.pulls.listRequestedReviewers({
              owner, repo, pull_number: prNumber,
            });
            if ((requested.teams || []).some((t) => t.slug === TEAM)) {
              core.info(`PR #${prNumber} already has the ${TEAM} team requested -- skipping.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            if (reviews.some((r) => r.user && r.user.login === 'openlibrary-bot')) {
              core.info(`PR #${prNumber} already has an openlibrary-bot review -- skipping.`);
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner, repo, pull_number: prNumber,
              team_reviewers: [TEAM],
            });

            // Verify the request actually took. requestReviewers can return 200/201 yet leave
            // requested_reviewers EMPTY -- neither 422 nor 404 (documented in this repo at
            // pr_autoresponder.md:72). For a TEAM request that silent no-op is the EXPECTED failure
            // when the default (repo-scoped) GITHUB_TOKEN cannot resolve the org team, so a success
            // log here would hide a dead same-repo auto-review path. Re-GET and assert the team is
            // present; fail loudly (not a false info) if it is not.
            const { data: after } = await github.rest.pulls.listRequestedReviewers({
              owner, repo, pull_number: prNumber,
            });
            if (!(after.teams || []).some((t) => t.slug === TEAM)) {
              core.setFailed(
                `Requested the ${TEAM} team on PR #${prNumber} but it is absent on a follow-up read -- ` +
                `the request silently no-opped. The default GITHUB_TOKEN likely cannot resolve the org ` +
                `team; auto_assign needs a token with org read (a PAT) to request it.`
              );
              return;
            }
            core.info(`Requested the ${TEAM} team as reviewer on PR #${prNumber}.`);
