name: new_pr_labeler
on:
  pull_request_target:
    types:
      - opened
env:
  NODE_VERSION: '24'
jobs:
  label_pr:
    # Continue only if this is the canonical repo and the PR is not a draft.
    #
    # Note this guard intentionally does NOT exclude fork-authored PRs -- those should
    # be labeled too, and pull_request_target keeps the write token needed to do it.
    if: ${{ github.repository == 'internetarchive/openlibrary' && !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v5
        id: cache-octokit
        with:
          path: 'node_modules'
          # Cache key shared across workflows
          key: ${{ runner.os }}-node${{ env.NODE_VERSION}}-octokit-${{ hashFiles('**/package-lock.json') }}
      - if: steps.cache-octokit.outputs.cache-hit != 'true'
        run: npm install @octokit/action
      - run: node scripts/gh_scripts/new_pr_labeler.mjs ${{ github.repository }} ${{ github.event.pull_request.user.login }} ${{ github.event.pull_request.number }} "$PR_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
