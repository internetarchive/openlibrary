name: PR Auto-Responder

# pull_request_target, not pull_request.
#
# Under `pull_request`, a fork-originated run gets a read-only GITHUB_TOKEN and cannot
# be granted `id-token: write` at all, so claude-code-action dies before doing anything:
#   Action failed with error: Could not fetch an OIDC token.
# Since Open Library takes most PRs from forks, this workflow failed on precisely the
# contributors it exists to welcome, and succeeded only for staff. Recent casualties:
# #13260, #13252, #13246. `pull_request_target` runs in the base-repo context and keeps
# both the write token and OIDC.
#
# SECURITY -- read before editing the checkout step below.
#
# `pull_request_target` is only safe here because this job never executes fork code:
# `actions/checkout` runs with NO `ref:`, so it checks out the BASE commit. Adding
# `ref: ${{ github.event.pull_request.head.sha }}` (or head.ref) would check out the
# contributor's branch and run it with a write token, a PAT and repository secrets in
# scope. Do not do that.
#
# What remains, and is accepted deliberately: the model *reads* untrusted PR content
# (title, body, diff) while holding OL_BOT_PAT, so prompt injection is a real surface.
# It is bounded by --allowedTools below and by pr_autoresponder.md, which forbids
# merging, closing and editing code. `Bash(gh api:*)` is the widest remaining grant --
# narrowing it to the specific read calls Step 1 needs would shrink the surface further,
# and is left as a follow-up rather than bundled here because changing allowedTools has
# already been shown to alter behaviour in ways that need their own test cycle.
on:  # zizmor: ignore[dangerous-triggers] -- safe: checkout below runs with NO `ref:`, so the base commit is checked out and no fork code is ever executed; see the SECURITY note above
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Debug: manually run the auto-responder on a specific existing PR"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  # `github.event.pull_request.number` is empty on workflow_dispatch, which collapsed
  # every manual run into one group named `pr-autoresponder-`. Fall back to the input.
  group: pr-autoresponder-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    # openlibrary-bot's account type is "User", not "Bot" (GitHub API confirms
    # this), so `user.type != 'Bot'` alone does NOT exclude it -- it only
    # catches genuine GitHub Apps (dependabot[bot], renovate[bot], etc). The
    # explicit login check below is required to skip our own bot's PRs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.type != 'Bot' &&
       github.event.pull_request.user.login != 'openlibrary-bot' &&
       !github.event.pull_request.draft)
    steps:
      # NO `ref:` -- deliberately checks out the base commit, not the PR head. See the
      # SECURITY note at the top of this file before changing this.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: First-touch PR response
        # Pinned deliberately -- do not restore the floating `@v1`. Same upstream
        # regression as issue_enrichment.yml: this SHA is
        # "chore: bump Claude Code to 2.1.212 and Agent SDK to 0.3.212" (2026-07-17),
        # the last version confirmed to post output. After `@v1` moved past it, every
        # run *in this repo* reported success while posting nothing, including on
        # same-repo PRs (#13212, #13209, #13200). See PR body.
        #
        # Scope: this is not a blanket break for all consumers. It is specific to
        # workflows setting `allowed_non_write_users` (this one does, below), which
        # enables subprocess isolation; see the fuller note in issue_enrichment.yml and
        # upstream anthropics/claude-code-action#1547.
        #
        # Note this is also a separate bug from the fork-token failure tracked in #13214
        # -- that one makes fork PRs fail loudly, this one makes every PR silently no-op.
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1 @ SDK 0.3.212
        with:
          prompt: |
            @.github/workflows/pr_autoresponder.md

            ${{ github.event_name == 'workflow_dispatch' && format('Manual test dispatch: run the first-touch flow on PR #{0}. Fetch its data yourself in Step 1 -- do not assume anything about it from this line.', inputs.pr_number) || format('PR #{0} was just opened by @{1}.\nTitle: {2}', github.event.pull_request.number, github.event.pull_request.user.login, github.event.pull_request.title) }}
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(git *) Bash(grep:*) Bash(cat:*) Bash(gh pr view:*)
            Bash(gh pr diff:*) Bash(gh pr checks:*) Bash(gh pr comment:*) Bash(gh pr edit:*)
            Bash(gh issue view:*) Bash(gh issue list:*) Bash(gh pr list:*)
            Bash(gh api:*) Bash(gh label list:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.OL_BOT_PAT }}
          # PR authors on a public repo mostly have only read access, same reasoning
          # as issue_enrichment.yml. NOTE: #13161 found this bypass unreliable for
          # issues due to a GitHub Actions workflow-resolution lag for non-ref-tied
          # events -- pull_request events ARE ref-tied (unlike issues), so this
          # workflow is less exposed to that specific failure mode, but it hasn't
          # been independently verified. Re-check if PRs start showing the same
          # "insufficient permissions" rejection issue #13161 documented.
          allowed_non_write_users: "*"
