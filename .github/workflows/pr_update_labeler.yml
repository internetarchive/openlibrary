name: pr_update_labeler

# Removes `Needs: Submitter Input` when the author pushes new commits (actions/labeler with
# sync-labels; .github/labeler.yml has no matching rules, so the sync just clears labels).
#
# SECURITY -- read before editing the checkout step below.
#
# `pull_request_target` runs with a write token even on fork PRs. That is only safe because
# this job never executes PR code: the checkout has no `ref:`, so it gets the base commit,
# and actions/labeler only reads changed-file names from the API. Never add
# `ref: ${{ github.event.pull_request.head.sha }}` (or any PR ref) here.
on:  # zizmor: ignore[dangerous-triggers] -- safe: checkout has no `ref:` (base commit); actions/labeler only reads changed-file names via the API. _target is required: a fork's pull_request token cannot remove Needs: Submitter Input.
  pull_request_target:
    types:
      - synchronize
    branches:
      - master
jobs:
  labeler:
    if: github.repository == 'internetarchive/openlibrary'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
