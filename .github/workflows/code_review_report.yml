name: Code Review Weekly Report

# A weekly report on how @openlibrary-bot's code review did (instructions in code_review_report.md).
# It always writes the report to this run's summary, and opens an issue only when something needs
# attention: a threshold in report_stats.cjs tripped, or the model flagged something.
#
# Jobs:
#   stats    collects the numbers from the GitHub API, with no model. Read-only token.
#   report   the model writes report.json from stats.json. No write access and no PAT.
#   publish  writes the run summary and opens or comments on the issue. It holds the issue PAT and
#            runs no model.
# stats.json carries PR review replies, which anyone can write, so the job that reads it with a
# model has nothing to write with. Keep it that way.
on:
  schedule:
    # Sundays at 13:00 UTC: 5 a.m. Pacific in winter, 6 a.m. in summer.
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to cover (1-31)"
        required: false
        default: "7"
        type: string
      dry_run:
        description: "Write the run summary only; never open an issue"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: code-review-report
  cancel-in-progress: false

jobs:
  stats:
    if: github.repository_owner == 'internetarchive'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read         # workflow runs and jobs
      checks: read          # a failed job's error annotations
      pull-requests: read   # the bot's reviews and threads
    steps:
      # Only the review scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Collect the stats
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DAYS: ${{ inputs.days }}
        with:
          script: |
            const { collect } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/code_review/report_stats.cjs`);
            await collect({ github, context, core, require, process });

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-review-report-stats
          path: stats.json
          if-no-files-found: error
          retention-days: 30

  report:
    needs: stats
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # claude-code-action's OIDC token exchange needs this. It grants no repository write access.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: code-review-report-stats

      - name: Write the report
        # Pinned like code_review_action.yml's Review step; see the note there.
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1 @ SDK 0.3.212
        with:
          prompt: |
            @.github/workflows/code_review_report.md

            Write `report.json` from `stats.json`.
          # No shell or web. Spell the write scope `Edit(...)`: see code_review_action.yml.
          claude_args: >-
            --max-turns 15
            --allowedTools "Edit(./report.json) Read(./**)"
            --disallowedTools "Bash WebFetch WebSearch"
          claude_code_oauth_token: ${{ secrets.OL_BOT_CLAUDE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: false
          display_report: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-review-report
          path: report.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [stats, report]
    # Also when the report job failed: the numbers and alerts still get published.
    if: always() && needs.stats.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the checkout below; the issue is written with the bot's PAT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: code-review-report-stats

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: code-review-report

      - name: Publish the summary, and the issue if needed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.OL_BOT_ISSUE_PAT }}
          script: |
            const { publish } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/code_review/report_post.cjs`);
            await publish({ github, context, core, require, process });
