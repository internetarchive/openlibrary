name: javascript_tests
on:
  push:
    branches: [ master ]
  # No `branches:` or `paths:` filter here: javascript_tests is a required status check on master, and
  # a workflow skipped by a trigger filter never reports, leaving the PR unmergeable.
  # That includes a stacked PR, which targets the branch of the PR below it.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  javascript_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Should match what's in our Dockerfile
          node-version: '26' # Also update the `key` in the `with` map, below
          check-latest: true # Don't use an older 26.x from the runner's tool cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          # Caching node_modules isn't recommended because it can break across
          # Node versions and won't work with npm ci (See https://github.com/actions/cache/blob/main/examples.md#node---npm )
          # But we pin the node version, and we don't update it that often anyways. And
          # we don't use `npm ci` specifically to try to get faster CI flows. So caching
          # `node_modules` directly.
          path: 'node_modules'
          # Note the version number in this string -- update it when updating Node!
          key: ${{ runner.os }}-node26-${{ hashFiles('**/package-lock.json') }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit
      - name: Ensure node_modules timestamp is up to date
        run: touch node_modules
      # No `npm run lint` step: pre-commit.ci already runs every check it covers.
      - run: make git
      - run: npx concurrently --group 'make js' 'make css' 'make components'
      - run: npm run test:js
      # Browser-mode component tests (tests/browser/) run the components in
      # real Chromium via Playwright. The runner image ships Chromium's system
      # libraries already (verified: every --with-deps package was current), so
      # only the revision-locked browser binaries need fetching.
      - run: npx playwright install chromium
      - run: npm run test:js:browser

  # Separate from javascript_tests so a size failure is its own named check and
  # doesn't skip the browser tests. Builds only JS and CSS, which is all it measures.
  bundlesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Should match what's in our Dockerfile
          node-version: '26' # Also update the `key` in the `with` map, below
          check-latest: true # Don't use an older 26.x from the runner's tool cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          # Caching node_modules isn't recommended because it can break across
          # Node versions and won't work with npm ci (See https://github.com/actions/cache/blob/main/examples.md#node---npm )
          # But we pin the node version, and we don't update it that often anyways. And
          # we don't use `npm ci` specifically to try to get faster CI flows. So caching
          # `node_modules` directly.
          path: 'node_modules'
          # Note the version number in this string -- update it when updating Node!
          key: ${{ runner.os }}-node26-${{ hashFiles('**/package-lock.json') }}
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit
      - name: Ensure node_modules timestamp is up to date
        run: touch node_modules
      - run: make git
      - run: npx concurrently --group 'make js' 'make css'
      - run: npm run test:bundlesize
