name: Code Review Action

# Implements the Code Review Action from epic #13160:
#   "an @openlibrary-bot-driven code review, triggered when staff request it as a PR reviewer
#    or @-mention it directly in a PR comment (staff-only trigger, for security). Should post
#    inline suggestion-style comments on specific code blocks/lines, similar to Copilot's
#    review UX. On re-trigger, should review only the diff since its last pass."
#
# SECURITY -- the two-job split below is the whole design, read before editing.
#
# `analyze` reads untrusted PR content (diff, source) and holds NO write permission and NO PAT.
# `post` holds the write permission and the scoped PAT, runs no model, and takes the analysis only as
# a JSON artifact which it re-validates against the diff before posting. A prompt injection in
# a PR can therefore change what the review *says*, but cannot reach a write API, because the
# process that read it has nothing to write with.
#
# Do not "simplify" this into one job. Do not add any PAT to `analyze`. Do not add write
# scopes to `analyze`'s permissions block.
#
# DISCLOSURE GATE -- POST BY DEFAULT (epic #13160 reframe). The review exists to CATCH harmful
# PRs before merge, so a finding about the PR's OWN proposed code is PUBLISHED -- that visibility
# is the point. The ONLY thing never made public is a finding that discloses a vulnerability
# already LIVE in deployed (base) code; that is routed PRIVATE (a GHSA sink, in a later PR) and,
# until that sink lands, dropped. REVIEW_GATE_JS below is the one definition of this split
# (classify / routeFinding); both jobs evaluate that same text:
#   - `analyze` runs it after the model. It is the AUTHORITATIVE classifier (the only job with the
#     model output AND the base tree AND the diff). It uploads ONLY the classified, redacted
#     PUBLIC payload, or a fixed stub when there is no public finding. The raw model review.json is
#     NEVER uploaded or logged; private findings leave the runner by no path in this PR. Artifacts
#     on a public repo are downloadable by any signed-in user, so the artifact is a public surface
#     and this is THE containment point.
#   - `post` checks out NO tree (so it never materialises fork content). It re-runs the base-FREE
#     parts of routeFinding on each public-payload finding, against its own re-fetched diff
#     (disclosure label, added-line anchor, shape-with-sink_ref, credential guard), fail-closed on
#     disagreement: it can DEMOTE public->private (drop) but never promote. Base-presence is
#     analyze's authoritative call. `post` holds the sole write PAT and renders the public payload.
# Routing is by WHERE THE VULNERABLE CONSTRUCT LIVES, fail-closed to PRIVATE (see REVIEW_GATE_JS).
# Every NON-posting outcome -- all-private, nothing-to-say, malformed -- is a GREEN job with no
# comment and the same stub artifact, so the absence of a comment never signals a private finding.
# No review text, count, or reason is ever written to the public run log.
#
# KNOWN ACCEPTED LIMITATION (the post-by-default trade-off, #13160; ruled by the security lead,
# Mek FYI'd). The gate constrains the STRUCTURE of a finding -- its anchor line, its sink_ref
# symbol, and literal credential VALUES -- not the free-text SEMANTICS of the summary or a finding
# body. A model suborned by a prompt injection in the PR can therefore narrate, in prose, a
# vulnerability that is live in the (already-public) base code and have it posted. This is bounded:
# on a public repo no secret source leaks -- the harm is publicly advertising a live base weakness
# that anyone analysing the public source could derive. It is NOT deterministically closable: a
# prose scan would false-positive on exactly the legitimate PR-introduced security findings this
# bot exists to post. Mitigations: the honest-model classification is the primary control;
# code_review.md instructs the model to treat all PR content as untrusted and to raise an injection
# attempt as a finding; and MUST-FIX 1 neutralises the summary whenever any finding is private (the
# honest-model common case). The finding-body channel is inherent to posting model prose by design.
#
# Fork PRs: `pull_request` from a fork gets no secrets, so the review_requested path covers
# same-repo PRs only. The `issue_comment` path runs in base-repo context WITH secrets and does
# cover fork PRs -- which is why that path is staff-gated by an explicit allowlist below.
# `analyze` never checks fork code into the working tree. It fetches the PR head into a ref and
# extracts a copy into pr-head/ with executable bits, symlinks and agent config (.claude/,
# .mcp.json, CLAUDE.md) removed; nothing runs it. The model has no shell, can read only inside
# the workspace, and can write only review.json -- see the Review step.

env:
  # REVIEW_GATE_JS -- the engine-agnostic DISCLOSURE GATE. Evaluates to an object exposing
  # classify(review, ctx) and routeFinding(finding, ctx). It takes a structured review
  # (findings-as-JSON from ANY review engine) plus a diff/base context, and splits findings into a
  # PUBLIC payload (posted) and a PRIVATE list (a vuln already LIVE in deployed/base code -> GHSA
  # sink in a later PR; dropped for now). It OWNS the publish/route decision; it does not produce
  # the review. See code_review.md for the model contract.
  #
  # POST-BY-DEFAULT (epic #13160 reframe): a review of a PR's OWN proposed code is published --
  # catching a harmful change before merge is the whole point. The ONLY thing never made public is
  # a finding that discloses a vulnerability already LIVE in deployed (base) code. Routing is by
  # WHERE THE VULNERABLE CONSTRUCT LIVES, fail-closed to PRIVATE:
  #   - disclosure = pre-existing-live, or absent/invalid        -> PRIVATE
  #   - pr-introduced, but anchored to a base/unchanged line     -> PRIVATE (escalate)
  #   - pr-introduced, but sink_ref resolves on the base tree    -> PRIVATE (escalate; live sink)
  #   - pr-introduced disclosure-SHAPE finding with no sink_ref  -> PRIVATE (fail-closed)
  #   - otherwise                                                -> PUBLIC
  # The two cross-checks ESCALATE only (never downgrade), so they strictly add disclosure safety.
  # `secrets` is a value-echo SCRUBBER overlay (a literal credential is redacted from public text),
  # never a router: a PR-introduced hardcoded secret still posts by location + a rotate warning,
  # because its value is already public in the diff.
  REVIEW_GATE_JS: |
    ({
      dimensions: {
        correctness: 'Correctness', security: 'Security', accessibility: 'Accessibility',
        test_coverage: 'Test coverage', styleguide: 'Styleguide',
      },
      severities: ['high', 'medium', 'low'],
      disclosures: ['pr-introduced', 'pre-existing-live'],

      // A finding describes an exploitable MECHANISM. Used ONLY to fail a `pr-introduced` finding
      // CLOSED to private when it lacks the structured proof (a PR-local sink_ref) that the construct
      // is new -- never to withhold a whole review. Post-by-default means a pr-introduced mechanism
      // with a resolved PR-local sink_ref IS published: catching it before merge is the whole point.
      shapes: /\b(inject\w*|xss|cross[- ]site|csrf|xsrf|ssrf|rce|remote code|code execution|open[- ]redirect|path traversal|directory traversal|(un)?authori[sz]\w*|exfiltrat\w*|(auth\w*|permission|access|login|csrf|validation) bypass\w*|bypass\w* (the )?(auth\w*|permission|access|login|csrf|validation)|(missing|no|without( an?)?|lacks?( an?)?) (auth\w*|permission|access|ownership|owner|csrf|host|origin) (check|validation|verification)\w*|without (checking|validating|verifying) the (host|origin|domain|scheme|redirect|owner\w*)|another (patron|user|account|reader)'?s|yaml\.load|deserializ\w*|pickle|shell\s*=\s*true|sql\w* (string|injection)|(concatenat|interpolat|format|substitut)\w* into (the |a )?(sql|query|shell|command)|unsaniti[sz]ed|unescaped|clickjack\w*|redos|denial of service)\b/i,
      // Shapes that aren't \b-words.
      shapePatterns: /\|\s*safe\b|\beval\s*\(|\bexec\s*\(|\bos\.system\b|\bMarkup\s*\(/i,

      // Literal credential VALUE shapes. NOT a router -- a print-guard. NO /g flag, so `.test()` is
      // stateless (a /g regex's lastIndex makes repeated .test() alternate true/false). redact()
      // rebuilds a global copy to scrub all occurrences.
      secrets: /sk-ant-[\w-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_\w{30,}|eyJ[\w-]{8,}\.[\w-]{8,}\.[\w-]{6,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}/,

      path: /^(?!.*(^|\/)\.\.(\/|$))[A-Za-z0-9_.][A-Za-z0-9_.\/-]*$/,
      // A sink_ref is a code identifier or repo-relative path, no spaces/markdown; bounded.
      sinkRef: /^[A-Za-z0-9_.][A-Za-z0-9_.\/-]{0,200}$/,
      maxText: 65536,

      // Normalize text the way GitHub renders it, so a scan sees the words a reader would.
      plain(t) {
        if (typeof t !== 'string') return '';
        return t.normalize('NFKC')
          .replace(/<!--[\s\S]*?(-->|$)/g, '').replace(/<[^<>]*>/g, '')
          .normalize('NFKD').replace(/[\p{Cf}\p{M}]/gu, '')
          .replace(/\[([^\[\]]*)\]\([^()]*\)/g, '$1').replace(/[*`~]/g, '')
          .replace(/_/g, ' ').replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2')
          .normalize('NFKC');
      },

      // Redact any literal credential value from text bound for a public surface.
      redact(t) {
        return typeof t === 'string'
          ? t.replace(new RegExp(this.secrets.source, 'g'), '[redacted credential — rotate, treat as compromised]')
          : t;
      },
      // Does this value contain a literal credential shape? (stateless; secrets has no /g)
      secretsTest(v) { return typeof v === 'string' && this.secrets.test(v); },

      // Does this finding anchor ONLY to added (+) lines of the reviewed diff?
      //   true  -> cited lines are new (only in pr-head)   [POST-eligible]
      //   false -> touches a context/unchanged base line   [escalate PRIVATE]
      //   null  -> no usable in-diff anchor                [indeterminate]
      anchorAddedOnly(f, ctx) {
        if (!f.path || !ctx.added || !ctx.added.has(f.path)) return null;
        const start = Number(f.start_line != null ? f.start_line : f.line), end = Number(f.line);
        if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start) return null;
        const added = ctx.added.get(f.path);
        let sawAdded = false;
        for (let ln = start; ln <= end; ln++) {
          // Fail-closed: every anchored line must be an ADDED (+) line of the reviewed diff. A
          // context/unchanged line (code live on base) or any line outside the added set escalates.
          if (!added.has(ln)) return false;
          sawAdded = true;
        }
        return sawAdded ? true : null;
      },

      // Route one finding: 'public' | 'private'. Fail-closed to 'private'. Escalate-only cross-checks.
      routeFinding(f, ctx) {
        const d = f.disclosure;
        if (d === 'pre-existing-live') return 'private';
        if (d !== 'pr-introduced') return 'private';                 // absent / invalid -> fail-closed
        // `sink_ref` and `path` are published to the artifact UN-redacted (post needs them intact), so
        // a credential value smuggled through either must never go public: route private, don't trust.
        if (this.secretsTest(f.sink_ref) || this.secretsTest(f.path)) return 'private';
        if (this.anchorAddedOnly(f, ctx) !== true) return 'private'; // must anchor to added lines only
        const ref = (typeof f.sink_ref === 'string' && this.sinkRef.test(f.sink_ref)) ? f.sink_ref : null;
        if (ref && ctx.baseHasSymbol(ref)) return 'private';         // sink lives unchanged on base
        const text = this.plain([f.title, f.body].filter((x) => x != null).join('\n'));
        const shaped = this.shapes.test(text) || this.shapePatterns.test(text);
        if (shaped && !ref) return 'private';                        // exploitable mechanism, no PR-local proof
        return 'public';
      },

      // Validate schema + split findings. Fail-closed: malformed -> { ok:false, public:null, private:[] }.
      classify(review, ctx) {
        try { return this.evaluate(review, ctx); } catch (e) { return { ok: false, public: null, private: [] }; }
      },
      evaluate(review, ctx) {
        const fail = { ok: false, public: null, private: [] };
        const str = (v) => typeof v === 'string';
        const absent = (v) => v === undefined || v === null;
        const line = (v) => absent(v) || (Number.isInteger(v) && v > 0);
        if (!review || typeof review !== 'object' || Array.isArray(review)) return fail;
        const { dimensions: dims, findings } = review;
        if (!str(review.summary) || !Array.isArray(findings) || !dims || typeof dims !== 'object') return fail;

        const pub = [], priv = [], modelCounts = {}, pubCounts = {};
        for (const f of findings) {
          if (!f || typeof f !== 'object' || !str(f.dimension) || !Object.hasOwn(this.dimensions, f.dimension)) return fail;
          if (!this.severities.includes(f.severity) || !str(f.title) || !f.title.trim() || !str(f.body) || !f.body.trim()) return fail;
          if (!line(f.line) || !line(f.start_line)) return fail;
          if (!absent(f.path) && !(str(f.path) && this.path.test(f.path))) return fail;
          if (!absent(f.suggestion) && !str(f.suggestion)) return fail;
          if (!absent(f.disclosure) && !this.disclosures.includes(f.disclosure)) return fail; // invalid enum -> malformed
          if (!absent(f.sink_ref) && !str(f.sink_ref)) return fail;
          modelCounts[f.dimension] = (modelCounts[f.dimension] || 0) + 1;

          if (this.routeFinding(f, ctx) === 'public') {
            // MUST-FIX 2: retain `disclosure` + `sink_ref` on PUBLIC findings so POST can re-run the
            // full routeFinding independently (the real two-independent-evaluations). Both name
            // PR-introduced constructs already visible in the public diff, so they are non-sensitive.
            const c = {
              dimension: f.dimension, severity: f.severity,
              title: this.redact(f.title), body: this.redact(f.body),
              disclosure: f.disclosure,
            };
            for (const k of ['path', 'start_line', 'line', 'sink_ref']) if (!absent(f[k])) c[k] = f[k];
            if (!absent(f.suggestion)) c.suggestion = this.redact(f.suggestion);
            pub.push(c);
            pubCounts[f.dimension] = (pubCounts[f.dimension] || 0) + 1;
          } else {
            priv.push({ dimension: f.dimension, severity: f.severity, title: f.title, body: f.body });
          }
        }

        // Validate the model's own dimension self-consistency (integrity check only; not the router).
        for (const k of Object.keys(this.dimensions)) {
          const dd = dims[k], n = modelCounts[k] || 0;
          if (!dd || typeof dd !== 'object' || (dd.status !== 'none' && dd.status !== 'findings')) return fail;
          if ((dd.status === 'none') !== (n === 0)) return fail;
          if (!absent(dd.note) && !str(dd.note)) return fail;
        }

        // PUBLIC payload.
        // MUST-FIX 1 (gap#1, deterministic): the model's free-text summary may describe a
        // pre-existing-live finding, and redact() scrubs only credential VALUES, not prose. So the
        // model summary is rendered ONLY when NOTHING is routed private (nothing to leak); whenever a
        // private finding exists, the summary is a neutral line built from public counts. No trust in
        // model discipline. The dimensions block is always rebuilt by the renderer from PUBLIC counts
        // (never the model's status/notes), so the public surface cannot reveal that a private finding
        // exists.
        const modelSummary = this.redact(review.summary);
        if (modelSummary.length > this.maxText) return fail;
        const total = pub.length;
        const summary = priv.length > 0
          ? `Review of this PR's changes.${total ? ` ${total} finding${total === 1 ? '' : 's'} below.` : ''}`
          : modelSummary;
        const publicReview = {
          summary,
          dimensions: {},                 // rebuilt by the renderer from pubCounts
          findings: pub,
          publicCounts: pubCounts,
        };
        return { ok: true, public: publicReview, private: priv };
      },
    })
on:
  pull_request:
    types: [review_requested, opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Debug: manually run the code reviewer on a specific existing PR"
        required: true
        type: string

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Three trigger paths:
    #   1. review_requested with openlibrary-bot as the reviewer -- covers both a human manually
    #      requesting it, and auto_assign_reviewer.yml's automated request. No staff-login check:
    #      requesting any reviewer already requires write/triage access on GitHub's side.
    #   2. opened / ready_for_review where the PR's own author is openlibrary-bot -- GitHub
    #      rejects requesting a PR's own author as a reviewer (422), so a self-authored PR can
    #      never reach this workflow via path 1.
    #   3. issue_comment @-mention on a PR -- open to any commenter including external
    #      contributors, and it runs with secrets in scope, so this path keeps an explicit
    #      staff allowlist.
    # Drafts: the three automatic paths above skip draft PRs -- no reviewing unfinished work.
    # A manual workflow_dispatch reviews a draft deliberately; it is the staff debug path, and
    # GitHub already requires write access to dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.requested_reviewer.login == 'openlibrary-bot' ||
          github.event.pull_request.user.login == 'openlibrary-bot'
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@openlibrary-bot') &&
        github.event.comment.user.login != 'openlibrary-bot' &&
        contains(fromJSON('["mekarpeles","cdrini","hornc","scottbarnes","seabelis","RayBB","lokesh"]'), github.event.comment.user.login)
      )
    permissions:
      contents: read
      pull-requests: read
      # Required by claude-code-action's OIDC fetch. GitHub accepts only `write` or `none`
      # here; `none` breaks the token exchange. This is NOT repository write access -- see
      # #13604, where removing it silently broke the PR auto-responder.
      id-token: write
    outputs:
      pr: ${{ steps.range.outputs.pr }}
      head_sha: ${{ steps.range.outputs.head_sha }}
      base_sha: ${{ steps.range.outputs.base_sha }}
      incremental: ${{ steps.range.outputs.incremental }}
      skip: ${{ steps.range.outputs.skip }}
    steps:
      # The base commit, never the PR head: on `pull_request` the default ref would be the
      # merge of the PR into base, so pin the base SHA; other events check out the default
      # branch, which is the base. See the SECURITY note above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Resolve review range (incremental since our last pass)
        id: range
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : (context.payload.pull_request
                  ? context.payload.pull_request.number
                  : context.payload.issue.number);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            // Draft check for the automatic paths -- issue_comment's payload has no draft field.
            // A manual dispatch reviews drafts on purpose (see the trigger comment above).
            if (pr.draft && context.eventName !== 'workflow_dispatch') { core.info(`PR #${prNumber} is a draft -- skipping.`); core.setOutput('skip','true'); return; }
            if (pr.state !== 'open') { core.info(`PR #${prNumber} is ${pr.state} -- skipping.`); core.setOutput('skip','true'); return; }

            const head = pr.head.sha;

            // Incremental: find the newest review WE submitted and diff from its commit.
            // Epic #13160's cross-cutting rule -- ignore our own bot -- is why we look for our
            // own reviews here rather than any review.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const ours = reviews.filter(r => r.user && r.user.login === 'openlibrary-bot' && r.commit_id);
            const prior = ours.length ? ours[ours.length - 1] : null;

            let base = pr.base.sha, incremental = false;
            if (prior && prior.commit_id !== head) {
              // Only trust the prior SHA if it is still reachable AND an ancestor of head; a
              // force-push can leave a commit_id that no longer describes this PR's history,
              // and diffing from it would silently mis-scope the review.
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${prior.commit_id}...${head}`,
                });
                if (cmp.data.status === 'ahead' && cmp.data.files && cmp.data.files.length) {
                  base = prior.commit_id; incremental = true;
                } else {
                  core.info(`Prior review commit is ${cmp.data.status} -- falling back to a full review.`);
                }
              } catch (e) {
                core.info(`Could not compare against the prior review commit (${e.message}) -- full review.`);
              }
            } else if (prior && prior.commit_id === head) {
              core.info('Already reviewed this exact commit -- skipping.');
              core.setOutput('skip','true'); return;
            }

            const { data: diff } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${head}`,
              headers: { accept: 'application/vnd.github.v3.diff' },
            });
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/review.diff`, diff);
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/review-range.json`, JSON.stringify({
              pr: prNumber, base_sha: base, head_sha: head,
              incremental, prior_review_at: prior ? prior.submitted_at : null,
            }, null, 2));

            core.setOutput('pr', String(prNumber));
            core.setOutput('head_sha', head);
            // Job outputs, set before the model runs, are what `post` trusts for the range --
            // not review-range.json, which the model can rewrite.
            core.setOutput('base_sha', base);
            core.setOutput('incremental', String(incremental));
            core.setOutput('skip', 'false');
            core.info(`PR #${prNumber}: ${incremental ? 'incremental' : 'full'} review, ${base.slice(0,8)}..${head.slice(0,8)}`);

      - name: Fetch PR head into a ref (never into the working tree)
        if: steps.range.outputs.skip == 'false'
        env:
          PR: ${{ steps.range.outputs.pr }}
        run: |
          git fetch --no-tags --depth=50 origin "pull/${PR}/head:refs/remotes/pr/head"

      - name: Extract the PR head as inert files (the model has no shell to read git with)
        if: steps.range.outputs.skip == 'false'
        run: |
          mkdir pr-head
          # $GIT_DIR/info/attributes outranks the PR's own .gitattributes, so the PR cannot hide
          # files (export-ignore), rewrite them (export-subst, ident) or run filters (filter).
          ATTR="$(git rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$ATTR")"
          printf '* -export-ignore -export-subst -ident -filter -text -eol\n' > "$ATTR"
          git archive --format=tar refs/remotes/pr/head | tar -x -C pr-head --no-same-owner
          rm -f "$ATTR"
          # Symlinks could point Read at files outside the workspace; agent config in a PR
          # could be picked up as instructions or settings.
          find pr-head -type l -delete
          find pr-head \( -iname .claude -o -iname .mcp.json -o -iname claude.md -o -iname claude.local.md \) -prune -exec rm -rf {} +
          # Nothing is left executable. Not `chmod -R a-x,a+X`: `X` keys off the original
          # mode, so that leaves executable files executable.
          find pr-head -type f -exec chmod a-x {} +

      - name: Review
        if: steps.range.outputs.skip == 'false'
        # Pinned deliberately -- do not restore the floating `@v1`. Same upstream regression as
        # issue_enrichment.yml and pr_autoresponder.yml: from a later version every run reports
        # success while producing nothing, in workflows that set `allowed_non_write_users`.
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1 @ SDK 0.3.212
        with:
          prompt: |
            @.github/workflows/code_review.md

            Review PR #${{ steps.range.outputs.pr }}. Your range and diff are already on disk --
            read `review-range.json` and `review.diff` rather than assuming anything from this line.
          # No shell: `git log --output=` and friends write arbitrary files, and `rg --pre` /
          # `git grep -O` run programs. Each tool is scoped to the workspace, and bare Grep/Glob
          # are not -- they reach outside it. Spell the write scope `Edit(...)`: at this pin
          # `Write(./review.json)` silently denies every write, including review.json, which
          # would withhold every review while looking like the gate working.
          claude_args: >-
            --max-turns 40
            --allowedTools "Edit(./review.json) Read(./**) Grep(./**) Glob(./**)"
            --disallowedTools "Bash WebFetch WebSearch"
          claude_code_oauth_token: ${{ secrets.OL_BOT_CLAUDE_OAUTH_TOKEN }}
          # Deliberately the job's own read-only GITHUB_TOKEN, NOT secrets.OL_BOT_PAT. This job
          # reads untrusted PR content; it must not hold a credential that can write. The PAT
          # lives in the `post` job below, which runs no model.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Both are the defaults at this pin, stated because the disclosure gate depends on them:
          # either one writes the model's text into the public run log or step summary.
          show_full_output: false
          display_report: false

      - name: Classify findings and prepare the PUBLIC-only artifact
        id: analyze-gate
        if: steps.range.outputs.skip == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const gate = eval(process.env.REVIEW_GATE_JS);
            const file = `${process.env.GITHUB_WORKSPACE}/review.json`;

            // CONTAINMENT INVARIANT (disclosure gate, DECISION 1a): the raw model review.json is
            // NEVER uploaded or logged. Only the classified, redacted PUBLIC payload is written here
            // and uploaded; the artifact is a public surface. Findings that disclose a vuln already
            // LIVE in deployed/base code are classified PRIVATE and, in this PR, DROPPED -- they
            // leave this runner by no path. (A later PR routes them to a private GHSA via a
            // credential scoped to this job and never shared with a fork-triggered context.)
            let review = null;
            try { review = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) { review = null; }

            // ctx for the gate: `added` = RIGHT-side added (+) lines per path from the reviewed
            // diff; baseHasSymbol greps the BASE tree (checked out at base.sha in `./`) for a
            // finding's structured sink_ref, excluding vendored trees. Both drive escalate-only
            // cross-checks; on any grep error we fail closed (treat as present -> escalate).
            const buildAdded = (diffText) => {
              // A `+++ ` line is a file header ONLY when its `--- ` pair is the previous line and we
              // are not inside a hunk. Inside a hunk an added line whose content begins with `++ `
              // reads as `+++ ...` but is `+<content>`, not a header -- requiring the `--- `
              // predecessor stops a PR from poisoning the added-line map with crafted `+++ b/x`
              // added content (F4). Only `+` lines inside a hunk count as added.
              const added = new Map(); let f = null, ln = 0, inHunk = false, prev = '';
              for (const raw of diffText.split('\n')) {
                if (raw.startsWith('diff --git ')) { f = null; inHunk = false; prev = raw; continue; }
                if (raw.startsWith('+++ ') && prev.startsWith('--- ') && !inHunk) {
                  const p = raw.slice(4).trim(); f = p === '/dev/null' ? null : p.replace(/^b\//, '');
                  if (f && !added.has(f)) added.set(f, new Set());
                  inHunk = false; prev = raw; continue;
                }
                const h = raw.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (h) { ln = Number(h[1]); inHunk = true; prev = raw; continue; }
                if (inHunk && f) {
                  if (raw.startsWith('+')) added.get(f).add(ln++);
                  else if (raw.startsWith(' ')) ln++;
                }
                prev = raw;
              }
              return added;
            };
            const baseHasSymbol = (ref) => {
              // Resolve `ref` against the BASE tree in `./`. A qualified ref
              // (openlibrary.core.lending.get_crossref) or a dotted/attribute form (self.fetch_url)
              // never appears literally in source, so grep its LAST identifier segment; a path-shaped
              // ref resolves by file existence. Fail-closed: anything we cannot isolate -> treat as
              // present (escalate). Exclude only node_modules/.git and the review artifacts / PR-head
              // extraction (those carry the PR's OWN added code, which must not resolve as "base") --
              // NOT vendor or .github, so a live sink in vendored or workflow code still escalates. (F2/F5)
              try { if ((ref.includes('/') || /\.[A-Za-z0-9]+$/.test(ref)) && !ref.includes('..') && fs.existsSync(ref)) return true; } catch (e) {}
              const seg = String(ref).split(/[./\\]/).filter(Boolean).pop();
              if (!seg || !/^[A-Za-z_]\w*$/.test(seg)) return true;
              try { execFileSync('grep', ['-rwFq', '--exclude-dir=node_modules', '--exclude-dir=.git', '--exclude-dir=pr-head', '--exclude=review.diff', '--exclude=review.json', '--exclude=review-range.json', '-e', seg, '.'], { stdio: 'ignore' }); return true; }
              catch (e) { return e && e.status === 1 ? false : true; }
            };
            let added = new Map();
            try { added = buildAdded(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/review.diff`, 'utf8')); } catch (e) {}
            const ctx = { added, baseHasSymbol };

            const res = gate.classify(review, ctx);
            // A fixed stub whenever there is NO public finding -- byte-identical for clean,
            // all-private, and malformed, so the artifact never signals which occurred.
            const STUB = JSON.stringify({ noPublicFindings: true });
            if (res.ok && res.public.findings.length > 0) {
              fs.writeFileSync(file, JSON.stringify({ summary: res.public.summary, findings: res.public.findings }));
            } else {
              fs.writeFileSync(file, STUB);
            }
            core.info('Analysis classified.'); // fixed line: no reason, count, or review text

      - name: Upload the public-only analysis
        if: steps.range.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-review-${{ steps.range.outputs.pr }}
          # review.json ONLY, after the classify step rewrote it to the public-only payload (or the
          # fixed stub). review.diff / review-range.json are not uploaded; `post` re-derives the
          # diff from job outputs (it checks out no tree).
          path: review.json
          if-no-files-found: error
          retention-days: 7

  post:
    needs: analyze
    if: needs.analyze.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the diff fetch below, with the job's own GITHUB_TOKEN
      pull-requests: write
    steps:
      # No checkout here, deliberately. `post` must never materialise a tree: on an incremental
      # re-review base_sha is an intermediate PR commit, which on a fork PR is fork-controlled
      # content (F6). The base-presence cross-check (grep of the real base tree) is authoritative in
      # `analyze`, which has the true base (pr.base.sha) and the model output; `post` independently
      # re-validates the cheaper, base-free parts of the gate -- disclosure label, added-line anchor
      # (against its own re-fetched diff), shape-without-sink_ref, and the credential guard -- and can
      # only DEMOTE a public finding to private, never promote. It holds the sole write PAT.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-review-${{ needs.analyze.outputs.pr }}

      - name: Re-fetch the reviewed diff (anchors are validated against this, not analyze's copy)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_SHA: ${{ needs.analyze.outputs.base_sha }}
          HEAD_SHA: ${{ needs.analyze.outputs.head_sha }}
        with:
          script: |
            const sha = /^[0-9a-f]{40}$/;
            const { BASE_SHA: base, HEAD_SHA: head } = process.env;
            if (!sha.test(base) || !sha.test(head)) { core.setFailed('Unexpected review range.'); return; }
            const { data: diff } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo, basehead: `${base}...${head}`,
              headers: { accept: 'application/vnd.github.v3.diff' },
            });
            require('fs').writeFileSync('review.diff', diff);

      - name: Validate anchors and post one batched review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.analyze.outputs.pr }}
          HEAD_SHA: ${{ needs.analyze.outputs.head_sha }}
          BASE_SHA: ${{ needs.analyze.outputs.base_sha }}
          INCREMENTAL: ${{ needs.analyze.outputs.incremental }}
        with:
          # Fine-grained PAT (openlibrary-bot) scoped to internetarchive/openlibrary only, with
          # Pull requests: Read and write and nothing else. Deliberately NOT the broad
          # OL_BOT_PAT, and deliberately not present in `analyze`.
          github-token: ${{ secrets.OL_BOT_REVIEW_PAT }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const prNumber = Number(process.env.PR);
            const headSha = process.env.HEAD_SHA;
            const gate = eval(process.env.REVIEW_GATE_JS);

            // --- Load the PUBLIC-only payload analyze produced. The stub (or any payload with no
            // findings) means there is nothing public to post: exit GREEN with no comment and no
            // annotation. That path is byte-identical for clean / all-private / malformed, so the
            // ABSENCE of a comment is never a signal that a private finding was found (DECISION 3).
            let payload = null;
            try { payload = JSON.parse(fs.readFileSync('review.json', 'utf8')); } catch (e) { payload = null; }
            const candidates = (payload && Array.isArray(payload.findings)) ? payload.findings : [];
            if (!candidates.length) { core.info('No public findings; nothing to post.'); return; }

            // --- Second-gate re-check (fail-closed on disagreement). Rebuild `added` from post's
            // OWN re-fetched diff and re-run routeFinding on each candidate. This is NOT a full
            // independent re-eval: it runs the same gate text, and base-presence is deliberately
            // skipped here (analyze owns it; post holds no tree -- see the step note). What it adds
            // is a check against post's independently re-fetched diff -- a finding posts only if it
            // re-validates as public (disclosure label, added-line anchor, shape-with-sink_ref,
            // credential guard). post can only DEMOTE public->private, never promote (the artifact
            // never carries a private finding). The authoritative disclosure surface is the
            // public-only artifact analyze produced.
            const buildAdded = (diffText) => {
              // A `+++ ` line is a file header ONLY when its `--- ` pair is the previous line and we
              // are not inside a hunk. Inside a hunk an added line whose content begins with `++ `
              // reads as `+++ ...` but is `+<content>`, not a header -- requiring the `--- `
              // predecessor stops a PR from poisoning the added-line map with crafted `+++ b/x`
              // added content (F4). Only `+` lines inside a hunk count as added.
              const added = new Map(); let f = null, ln = 0, inHunk = false, prev = '';
              for (const raw of diffText.split('\n')) {
                if (raw.startsWith('diff --git ')) { f = null; inHunk = false; prev = raw; continue; }
                if (raw.startsWith('+++ ') && prev.startsWith('--- ') && !inHunk) {
                  const p = raw.slice(4).trim(); f = p === '/dev/null' ? null : p.replace(/^b\//, '');
                  if (f && !added.has(f)) added.set(f, new Set());
                  inHunk = false; prev = raw; continue;
                }
                const h = raw.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (h) { ln = Number(h[1]); inHunk = true; prev = raw; continue; }
                if (inHunk && f) {
                  if (raw.startsWith('+')) added.get(f).add(ln++);
                  else if (raw.startsWith(' ')) ln++;
                }
                prev = raw;
              }
              return added;
            };
            // post holds no base tree (it checks nothing out), so base-presence is analyze's
            // authoritative call. Re-check only the base-free parts and never escalate on base.
            const ctx = { added: buildAdded(fs.readFileSync('review.diff', 'utf8')), baseHasSymbol: () => false };
            const findings = candidates.filter((f) => gate.routeFinding(f, ctx) === 'public');
            if (!findings.length) { core.info('No public findings after re-check; nothing to post.'); return; }
            const dropped = candidates.length - findings.length;

            // --- Inline comments. Every surviving public finding anchors to added (+) lines by
            // construction. redact() is applied again here as a print-guard: a literal credential
            // value never reaches a public surface (the finding still posts by location).
            const inline = [];
            for (const f of findings) {
              const start = Number(f.start_line || f.line);
              let body = gate.redact(`**${(f.severity || 'note').toUpperCase()} · ${gate.dimensions[f.dimension]} — ${f.title}**\n\n${f.body}`);
              if (f.suggestion != null) {
                const want = Number(f.line) - start + 1;
                const got = String(f.suggestion).split('\n').length;
                if (want === got) body += `\n\n\`\`\`suggestion\n${gate.redact(String(f.suggestion))}\n\`\`\``;
              }
              const c = { path: f.path, line: Number(f.line), side: 'RIGHT', body };
              if (start !== Number(f.line)) { c.start_line = start; c.start_side = 'RIGHT'; }
              inline.push(c);
            }

            // --- Summary. Rendered from PUBLIC counts only (never the model's per-dimension notes).
            // If post DEMOTED any finding, the analyze-time summary is not trusted (it may describe a
            // now-private finding): fall back to a neutral line.
            const count = {};
            for (const f of findings) count[f.dimension] = (count[f.dimension] || 0) + 1;
            let summary = dropped > 0
              ? `Review of this PR's changes. ${findings.length} finding${findings.length === 1 ? '' : 's'} below.`
              : gate.redact(String(payload.summary || `Review of this PR's changes.`));
            const sha = /^[0-9a-f]{40}$/, baseSha = process.env.BASE_SHA;
            if (process.env.INCREMENTAL === 'true' && sha.test(baseSha) && sha.test(headSha)) {
              summary = `*Reviewing only the ${baseSha.slice(0,8)}..${headSha.slice(0,8)} range — the commits pushed since my last pass.*\n\n${summary}`;
            }
            summary += '\n\n### Dimensions\n\n' + Object.entries(gate.dimensions).map(([k, label]) =>
              count[k] ? `- **${label}** — ${count[k]} finding${count[k] === 1 ? '' : 's'}` : `- **${label}** — no findings in this range.`
            ).join('\n');
            summary += `\n\n---\n> [!NOTE]\n> Automated review by [@openlibrary-bot](https://github.com/internetarchive/openlibrary/blob/master/.github/workflows/code_review.md) on behalf of @mekarpeles. It flags issues in this PR's proposed changes; it is **not** an approval or a sign-off, and it does not satisfy a required review.\n\n<!-- ol-pr-review-bot -->`;

            // --- One batched review. The per-comment endpoint (POST /pulls/{n}/comments) returns
            // 422 `pull_request_review_thread.base` in practice (cli/cli#13358); the batched payload
            // with identical anchors succeeds.
            const { data: posted } = await github.rest.pulls.createReview({
              owner, repo, pull_number: prNumber,
              commit_id: headSha,          // resolved at post time -- an older SHA silently outdates comments
              event: 'COMMENT',            // never APPROVE or REQUEST_CHANGES
              body: summary,
              comments: inline,
            });

            // --- Verify. This API surface can return 2xx while changing nothing, so confirm. A
            // genuine post failure is an operational error worth surfacing (it only fires when there
            // ARE public findings, so it is not a disclosure side channel).
            const after = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            if (!after.some((r) => r.id === posted.id)) {
              core.setFailed(`createReview returned ${posted.id} but it is not present on the PR.`);
              return;
            }
            core.info(`Posted review ${posted.id}: ${inline.length} inline.`);
