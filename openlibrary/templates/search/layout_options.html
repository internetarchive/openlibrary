$def with (selected_layout)

$# Must match the first segment: the control resolves an unknown value to it.
$ default_layout = 'details'

$# `label` is both the accessible name and the hover tooltip. list_books.js
$# owns what a change does; ?layout= is still resolved server-side.
<ol-segmented-control
  class="tools--layout"
  value="$(selected_layout or default_layout)"
  accessible-label="$_('View as')"
>
  <ol-segment value="details" label="$_('List')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </ol-segment>
  <ol-segment value="grid" label="$_('Grid')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
  </ol-segment>
</ol-segmented-control>
