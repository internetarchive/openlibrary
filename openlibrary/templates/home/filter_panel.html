<style>
  .home-filter-title {
    font-size: 16px;
    /* font-weight: 200; */
    font-size: 100%;
    color: #035A8C;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  .home-filter-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }

  .home-filter-controls > * {
    flex-shrink: 0;
  }

  .clear-all {
    padding: 3px var(--spacing-sm);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--border-radius-button);
    color: var(--darker-grey);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  @media (hover: hover) and (pointer: fine) {
    .clear-all:hover { background: var(--lightest-grey); }
  }

  .clear-all:focus-visible {
    outline: var(--focus-width) solid var(--color-focus-ring);
    outline-offset: 2px;
  }
</style>

<div class="home-filter-section" role="region" aria-label="$_('Home filters')">
  <div class="home-filter-title">$_('Filter')</div>

  <div class="home-filter-controls">
    <ol-toggle
      id="home-filter-availability"
      variant="button"
      label="$_('Readable Only')"
      accessible-label="$_('Filter by availability')"
    ></ol-toggle>

    <ol-select-popover
      id="home-filter-language"
      label="$_('Language')"
      placeholder="$_('Search languages…')"
      unselected-heading="$_('Languages')"
      aria-label="$_('Filter by language')"
    >
    </ol-select-popover>

    <button type="button" id="home-filter-clear-all" class="clear-all" hidden>
      $_('Clear all')
    </button>
  </div>
</div>
