$def with (book_title, edit_url, title_lang=None)

<div class="compact-title hidden">
  <span class="compact-title__heading" $:cond(title_lang, 'lang="%s"' % title_lang)>$book_title</span>
  <div class="compact-title__edit-btn">
    <a
      class="cta-btn cta-btn--vanilla"
      href="$edit_url"
      title="$_('Edit this page')"
      data-ol-link-track="CTAClick|StickyEdit"
      rel="nofollow"
    >$_("Edit")</a>
  </div>
</div>
