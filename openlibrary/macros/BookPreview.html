$def with (ocaid)
$# :param str ocaid:
$#
$# The label is always the verb. "Preview only" is a fact about the book, and
$# LoanStatus states it beside the button rather than inside it.

$if ocaid:
  <div class="cta-button-group">
    <a class="cta-btn cta-btn--preview"
      href="#bookPreview"
      data-book-preview
      data-iframe-src="https://archive.org/details/$ocaid?view=theater&wrapper=false"
      data-iframe-link="https://archive.org/details/$ocaid"
      data-ol-link-track="CTAClick|Preview">$_('Preview')</a>
  </div>

$:macros.BookPreviewFloater()
