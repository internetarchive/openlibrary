$def with (ocaid)
$# :param str ocaid:
$# A text-link Preview under a result's cover. Without an ocaid there is
$# nothing to preview, so nothing is shown.

$if ocaid:
  <div class="cta-button-group">
    <a class="cta-btn cta-btn--preview"
      href="#bookPreview"
      data-book-preview
      data-iframe-src="https://archive.org/details/$ocaid?view=theater&amp;wrapper=false&amp;q="
      data-iframe-link="https://archive.org/details/$ocaid"
      data-ol-link-track="CTAClick|Preview">$:macros.icon("book-open", size="sm")<span class="cta-btn__label">$_('Preview')</span></a>
  </div>

$:macros.BookPreviewFloater()
