$def with (name, size="md", label="")
$if label:
    <svg class="ol-icon ol-icon--${size}" role="img" aria-label="$label" focusable="false"><use href="#icon-${name}"></use></svg>
$else:
    <svg class="ol-icon ol-icon--${size}" aria-hidden="true" focusable="false"><use href="#icon-${name}"></use></svg>
$# Docs: /developers/design#icon-usage — keep comments below the output (Templetor emits a newline per line above it, which then ships with every icon).
