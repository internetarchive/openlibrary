##
## E2E contrast overlay: the ordinary dev path (compose.override.yaml mounts the checkout
## over /openlibrary, so pages render the .po files committed in the checkout), only
## with the image under test and ports that do not collide with other local stacks.
## Driven by tests/e2e/i18n-baked/run.sh.
##

services:
  web:
    image: "${OLIMAGE:?set OLIMAGE to the olbase image under test}"
    build: !reset null
    ports: !override
      - "127.0.0.1:${E2E_WEB_PORT:-18090}:8080"

  fast_web:
    image: "${OLIMAGE:?set OLIMAGE to the olbase image under test}"
    build: !reset null
    ports: !override
      - "127.0.0.1:${E2E_FAST_WEB_PORT:-18091}:8080"

  mockservices:
    ports: !reset []
  solr:
    ports: !reset []
  covers:
    ports: !reset []
