# Keep in sync with web_nginx.conf

# covers.openlibrary.org sits behind the Kubernetes external Envoy Gateway, which
# connects to us from somewhere in 207.241.224.0/20 and appends the real client
# IP to X-Forwarded-For. We trust that header from the whole /20 (the narrowest
# range we can get for the gateway, and it also covers our own internal hosts),
# so $remote_addr -- and everything keyed on it: rate limits, $is_internal_ip,
# deny lists, logs, the X-Forwarded-For we pass to gunicorn -- is the real client
# rather than the gateway. Requests from outside the /20, or with no
# X-Forwarded-For, are unchanged. Keep both copies of the CIDR below in sync.
set_real_ip_from 207.241.224.0/20;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The gateway terminates TLS and talks plain HTTP to us, so $scheme is "http".
# Take the scheme from its X-Forwarded-Proto instead, but only when the
# connection itself came from the trusted range ($realip_remote_addr is the
# address before the realip rewrite above).
geo $realip_remote_addr $from_trusted_proxy {
    default 0;
    207.241.224.0/20 1;
}
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

server {
    listen 80 default;
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/letsencrypt/live/covers.openlibrary.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/covers.openlibrary.org/privkey.pem;

    # Diffie-Hellman parameter for DHE ciphersuites, recommended 2048 bits
    ssl_dhparam /olsystem/etc/nginx/dhparam-2048.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;

    # Needed for logging/IP anonymization
    include /olsystem/etc/nginx/logging_periodics.conf;
}

# Docker's internal load balancing ends up with unbalanced connections eventually.
# This must be kept in sync with the `replicas` value in `compose.production.yaml`
# for the `covers` service.
upstream covers_backend {
  least_conn;
  server openlibrary-covers-1:7075;
  server openlibrary-covers-2:7075;
}

server {
      listen 80;
      listen 443;
      http2 on;
      server_name  covers.openlibrary.org;

      root /openlibrary;

      keepalive_timeout 5;

      # Return 429 errors as JSON.
      error_page 429 = @429;
      location @429 {
        default_type application/json;
        return 429 '{"status": 429, "message": "Too Many Requests. Please email us at info@archive.org"}';
      }

      # These mutate data and the coverstore has no auth of its own; only the OL web
      # servers call them (openlibrary/plugins/upstream/covers.py). Matched loosely so
      # that eg /B/upload2/ can't slip past.
      location ~* ^/[abw]/(upload2?|touch|delete)/?$ {
        if ($is_internal_ip = 0) {
          return 403;
        }
        # The web servers call these directly, without X-Forwarded-For. Anything
        # carrying that header came through a proxy (eg the gateway), so refuse it
        # even if its forwarded IP looks internal.
        if ($http_x_forwarded_for) {
          return 403;
        }

        proxy_pass http://covers_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Scheme $forwarded_proto;
      }

      location / {
        proxy_pass http://covers_backend;
        proxy_set_header Host $http_host;

        # Gunicorn takes IP from this header
        proxy_set_header X-Forwarded-For $remote_addr;

        # So the app builds https:// archive.org redirects even though we proxy to it
        # over plain http. X-Scheme is the same thing under web.py's name -- still sent
        # so that rolling the coverstore back to web.py keeps working; drop it once
        # that is no longer a possibility.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Scheme $forwarded_proto;

        if ($http_user_agent ~ (Bytespider) ) {
           return 444;
        }

        if ($http_user_agent ~ (CloudFront) ) {
           return 444;
        }


        # Covers rate limit.
        limit_req zone=cover_limit burst=400 nodelay;
        limit_req zone=global_crawler_cover_limit nodelay;
        limit_req_status 429;
      }

      location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /openlibrary/static;
      }

      location ~ ^(/images/.*|favicon.ico|robots.txt)$ {
        rewrite ^(.*)$ /static/$1 last;
      }

      location ~ ^/(y_key_[0-9a-f]+.html|google[0-9a-f]+.html|LiveSearchSiteAuth.xml)$ {
        root /olsystem/www;
      }

      location /static {
        autoindex on;
        expires 1h;
      }

      location /static/build {
        expires max;
      }

      location /static/sitemaps {
        root /sitemaps;
      }
}
